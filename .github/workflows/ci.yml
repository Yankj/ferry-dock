name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          git ls-files --eol cmd internal brand
          files="$(gofmt -l cmd internal brand)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d cmd internal brand
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/ferry-dock
      - run: python scripts/smoke-http.py
      - run: python scripts/smoke-request.py
      - run: node --check internal/relay/web/app.js
      - run: node scripts/test-ui.cjs
      - name: Exercise served scripts against the compiled service
        run: node scripts/smoke-ui.cjs --binary ./ferry-dock${{ runner.os == 'Windows' && '.exe' || '' }}

  package-preview:
    name: Build six CLI targets and local npm packages
    runs-on: macos-15
    timeout-minutes: 15
    env:
      FERRY_DOCK_PREVIEW_VERSION: '0.1.0-alpha.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: arm64
      - run: go mod download
      - name: Test executable-format rejection fixtures
        run: python3 scripts/test-native-format.py
      - name: Build all CLI archives and sealed test Apps
        run: python3 scripts/package.py --version "$FERRY_DOCK_PREVIEW_VERSION" --all --offline --out dist/native
      - name: Check archive contracts and the native Mac lifecycle
        run: python3 scripts/smoke-package.py --dist "dist/native/$FERRY_DOCK_PREVIEW_VERSION" --require-cli-targets
      - name: Reject altered App metadata and resource seals
        run: python3 scripts/test-app-signature.py --archive "dist/native/$FERRY_DOCK_PREVIEW_VERSION/ferry-dock-$FERRY_DOCK_PREVIEW_VERSION-darwin-arm64-app.zip"
      - name: Pack the same-version npm entry and six platform packages
        run: python3 scripts/package-npm.py --dist "dist/native/$FERRY_DOCK_PREVIEW_VERSION" --out dist/npm
      - name: Preserve test artifacts for the native matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-platform-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

  native-preview:
    name: Packaged native lifecycle / ${{ matrix.target }} / Node 22
    needs: package-preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            native-target: darwin/arm64
            node-arch: arm64
          - os: macos-15-intel
            target: darwin-amd64
            native-target: darwin/amd64
            node-arch: x64
          - os: ubuntu-24.04
            target: linux-amd64
            native-target: linux/amd64
            node-arch: x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            native-target: linux/arm64
            node-arch: arm64
          - os: windows-2025
            target: windows-amd64
            native-target: windows/amd64
            node-arch: x64
          - os: windows-11-arm
            target: windows-arm64
            native-target: windows/arm64
            node-arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FERRY_DOCK_PREVIEW_VERSION: '0.1.0-alpha.4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: ${{ matrix.node-arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cross-platform-preview
          path: dist
      - name: Check native process and service identity tests
        run: go test ./internal/desktop ./internal/relay
      - name: Validate native archives and owned service lifecycle
        run: python scripts/smoke-package.py --dist dist/native/0.1.0-alpha.4 --require-cli-targets --native-target ${{ matrix.native-target }} --receipt bin/native-preview.json
      - name: Verify Node runs as the intended native architecture
        run: node -e "const target=(process.platform==='win32'?'windows':process.platform)+'-'+(process.arch==='x64'?'amd64':process.arch);if(target!=='${{ matrix.target }}')throw new Error('Node architecture does not match the native test target')"
      - name: Check bounded asynchronous shutdown observations
        run: python scripts/test-npm-shutdown.py
      - name: Check offline npm install, platform selection and lifecycle
        run: python scripts/smoke-npm.py --dist dist/npm/0.1.0-alpha.4 --receipt bin/npm-preview.json
      - name: Preserve capability-free validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.target }}
          path: |
            bin/native-preview.json
            bin/npm-preview.json
          if-no-files-found: warn
          retention-days: 7
