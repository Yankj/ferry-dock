name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          git ls-files --eol cmd internal brand
          files="$(gofmt -l cmd internal brand)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d cmd internal brand
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/ferry-dock
      - run: python scripts/smoke-http.py
      - run: node --check internal/relay/web/app.js
