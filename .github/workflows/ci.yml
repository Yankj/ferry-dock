name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      FERRY_DOCK_PREVIEW_VERSION: '0.1.0-alpha.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          git ls-files --eol cmd internal brand
          files="$(gofmt -l cmd internal brand)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d cmd internal brand
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/ferry-dock
      - run: python scripts/smoke-http.py
      - run: python scripts/smoke-request.py
      - run: node --check internal/relay/web/app.js
      - run: node scripts/test-ui.cjs
      - name: Exercise served scripts against the compiled service
        run: node scripts/smoke-ui.cjs --binary ./ferry-dock${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Package local macOS previews
        if: runner.os == 'macOS' && matrix.go == '1.27.x'
        run: python3 scripts/package.py --version "$FERRY_DOCK_PREVIEW_VERSION" --offline
      - name: Check native packaged lifecycle
        if: runner.os == 'macOS' && matrix.go == '1.27.x'
        run: python3 scripts/smoke-package.py --dist "dist/$FERRY_DOCK_PREVIEW_VERSION"
      - name: Reject altered app metadata and resource seals
        if: runner.os == 'macOS' && matrix.go == '1.27.x'
        run: python3 scripts/test-app-signature.py --archive "dist/$FERRY_DOCK_PREVIEW_VERSION/ferry-dock-$FERRY_DOCK_PREVIEW_VERSION-darwin-arm64-app.zip"

  npm-preview:
    name: Local npm package / macOS arm64 / Node 22
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Obtain the pinned public Go artifact
        run: |
          mkdir -p bin/npm-input
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --output bin/npm-input/core.tar.gz https://github.com/Yankj/ferry-dock/releases/download/v0.1.0-alpha.2/ferry-dock-0.1.0-alpha.2-darwin-arm64.tar.gz
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --output bin/npm-input/manifest.json https://github.com/Yankj/ferry-dock/releases/download/v0.1.0-alpha.2/manifest.json
      - name: Pack the verified core with the npm entry
        run: |
          npm_preview_cli="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$(command -v npm)")"
          python3 scripts/package-npm.py --archive bin/npm-input/core.tar.gz --manifest bin/npm-input/manifest.json --out dist/npm --node "$(command -v node)" --npm-cli "$npm_preview_cli"
      - name: Check local install, exec, signals and lifecycle without registry writes
        run: |
          npm_preview_cli="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$(command -v npm)")"
          python3 scripts/smoke-npm.py --package dist/npm/0.1.0-alpha.2/ferry-dock-0.1.0-alpha.2.tgz --node "$(command -v node)" --npm-cli "$npm_preview_cli"
